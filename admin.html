<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>GymTrack - Administración</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- ESTÉTICA IDENTICA AL INDEX --- */
    :root { 
        --bg-app: #121212; 
        --bg-card: #1c1c1e; 
        --bg-input: #2c2c2e; 
        --primary: #0d6efd; 
        --text-main: #FFFFFF; 
        --text-sec: #A0A0A5; 
        --danger: #dc3545;
    }
    
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-main); padding-bottom: 40px; }

    /* NAVBAR */
    .navbar-custom { background-color: var(--bg-card); border-bottom: 1px solid #333; padding: 12px 20px; }
    
    /* CARDS & INPUTS */
    .hevy-card { background-color: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid #2a2a2a; }
    .form-control-dark { background-color: var(--bg-input); border: 1px solid #444; color: white; border-radius: 8px; padding: 10px; }
    .form-control-dark:focus { background-color: #333; color: white; border-color: var(--primary); outline: none; box-shadow: none; }

    /* TABLA PERSONALIZADA */
    .table-dark-custom { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0 8px; /* Espacio entre filas */
    }
    .table-dark-custom th { 
        color: var(--text-sec); 
        font-size: 0.8rem; 
        text-transform: uppercase; 
        padding: 10px; 
        border: none;
        user-select: none; /* Evita que se seleccione el texto al hacer click */
    }
    
    .table-dark-custom th:hover {
        color: white;
    }

    .user-row { 
        background-color: var(--bg-card); 
        cursor: pointer; 
        transition: 0.2s;
    }
    .user-row td { 
        padding: 15px 10px; 
        border: 1px solid #2a2a2a;
        vertical-align: middle;
    }
    /* Bordes redondeados en las filas */
    .user-row td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-right: none; }
    .user-row td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-left: none; }
    .user-row td:not(:first-child):not(:last-child) { border-left: none; border-right: none; }
    
    .user-row:hover { background-color: #252528; transform: translateY(-2px); }

    /* AVATAR */
    .avatar-small { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background-color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    
    /* MODAL */
    .modal-content-hevy { background-color: var(--bg-card); color: white; border: 1px solid #333; border-radius: 16px; }
    .detail-label { color: var(--text-sec); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { font-size: 1.1rem; font-weight: 600; color: white; margin-bottom: 12px; }
    .user-photo-large { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
    
    /* ANIMACIÓN */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } 
    .fade-in-up { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body>

  <script>
    const session = localStorage.getItem('gymtrack_user');
    if (!session) { window.location.href = 'login.html'; }
    else {
        const u = JSON.parse(session);
        if (u.es_admin !== 'S') { window.location.href = 'index.html'; }
    }
  </script>

  <div class="navbar-custom d-flex justify-content-between align-items-center sticky-top mb-4">
    <div class="d-flex align-items-center gap-2">
        <i class="fas fa-shield-alt text-primary fs-4"></i>
        <span class="fw-bold fs-5">Admin Panel</span>
    </div>
    <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="logout()">
        <i class="fas fa-sign-out-alt me-1"></i> Salir
    </button>
  </div>

  <div class="container">
    
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2 class="fw-bold mb-1">Usuarios</h2>
            <p class="text-secondary small mb-0">Gestión de alumnos y clases.</p>
        </div>
        <div class="col-md-6 mt-3 mt-md-0">
            <div class="position-relative">
                <i class="fas fa-search text-secondary position-absolute" style="left: 15px; top: 13px;"></i>
                <input type="text" id="search-input" class="form-control form-control-dark ps-5" placeholder="Buscar por nombre o apellido..." onkeyup="filtrarUsuarios()">
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table-dark-custom">
            <thead>
                <tr>
                    <th style="width: 60px;">Foto</th>
                    
                    <th onclick="ordenarLista('apellido')" style="cursor: pointer;" title="Ordenar alfabéticamente">
                        Apellido y Nombre <i class="fas fa-sort text-secondary ms-1 small"></i>
                    </th>
                    <th onclick="ordenarLista('clase')" style="cursor: pointer;" title="Agrupar por clase">
                        Clase / Objetivo <i class="fas fa-sort text-secondary ms-1 small"></i>
                    </th>
                    
                    <th class="text-end">Acción</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="4" class="text-center py-5 text-muted"><i class="fas fa-circle-notch fa-spin"></i> Cargando base de datos...</td></tr>
            </tbody>
        </table>
    </div>

  </div>

  <div class="modal fade" id="userDetailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-hevy">
        <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">Ficha de Alumno</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center pt-0">
            
            <div class="mb-3 d-flex justify-content-center">
                <img id="modal-img" src="" class="user-photo-large d-none">
                <div id="modal-initial" class="user-photo-large d-flex align-items-center justify-content-center bg-primary fs-1 fw-bold">U</div>
            </div>

            <h3 class="fw-bold mb-1" id="modal-fullname">Nombre</h3>
            <span class="badge bg-secondary rounded-pill mb-4 px-3 py-2" id="modal-clase">Sin Clase</span>

            <div class="row text-start px-2">
                <div class="col-6">
                    <div class="detail-label">DNI</div>
                    <div class="detail-value" id="modal-dni">--</div>
                </div>
                <div class="col-6">
                    <div class="detail-label">Teléfono</div>
                    <div class="detail-value" id="modal-tel">--</div>
                </div>
                <div class="col-12"><hr class="border-secondary"></div>
                <div class="col-6">
                    <div class="detail-label">Email</div>
                    <div class="detail-value fs-6 text-truncate" id="modal-email">--</div>
                </div>
                <div class="col-6">
                    <div class="detail-label">Fecha Nac.</div>
                    <div class="detail-value fs-6" id="modal-nac">--</div>
                </div>
                <div class="col-12"><hr class="border-secondary"></div>
                <div class="col-6">
                    <div class="detail-label">Peso</div>
                    <div class="detail-value text-primary" id="modal-peso">-- kg</div>
                </div>
                <div class="col-6">
                    <div class="detail-label">Altura</div>
                    <div class="detail-value text-primary" id="modal-altura">-- m</div>
                </div>
            </div>

        </div>
        <div class="modal-footer border-0 justify-content-center">
            <button class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];

    // 1. CARGAR USUARIOS AL INICIAR
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('api/obtener_usuarios.php');
            const data = await res.json();
            
            if(data.ok) {
                allUsers = data.data;
                renderUsers(allUsers);
            } else {
                document.getElementById('user-list').innerHTML = `<tr><td colspan="4" class="text-center text-danger">${data.msg}</td></tr>`;
            }
        } catch (e) {
            console.error(e);
            document.getElementById('user-list').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error de conexión</td></tr>`;
        }
    });

    // 2. RENDERIZAR LA TABLA
    function renderUsers(lista) {
        const container = document.getElementById('user-list');
        container.innerHTML = '';

        if(lista.length === 0) {
            container.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">No se encontraron usuarios.</td></tr>`;
            return;
        }

        lista.forEach(u => {
            // Preparar Avatar
            let avatarHtml = '';
            if (u.foto && u.foto !== 'default.jpg' && u.foto !== '') {
                avatarHtml = `<img src="img/usuarios/${u.foto}" class="avatar-small">`;
            } else {
                avatarHtml = `<div class="avatar-small">${u.nombre.charAt(0).toUpperCase()}</div>`;
            }

            // Preparar Badge de Clase
            let claseBadge = u.nombre_clase 
                ? `<span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25">${u.nombre_clase}</span>` 
                : `<span class="badge bg-secondary bg-opacity-25 text-secondary">Sin asignar</span>`;

            // Si es ADMIN, ponerle una coronita
            let adminIcon = (u.es_admin === 'S') ? '<i class="fas fa-crown text-warning ms-2" title="Administrador"></i>' : '';

            // Crear fila HTML
            const tr = document.createElement('tr');
            tr.className = 'user-row fade-in-up';
            tr.onclick = () => verDetalle(u.ID_Usuario);
            
            tr.innerHTML = `
                <td>${avatarHtml}</td>
                <td>
                    <div class="fw-bold text-white">${u.apellido}, ${u.nombre} ${adminIcon}</div>
                    <div class="small text-secondary" style="font-size: 0.75rem;">${u.mail}</div>
                </td>
                <td>${claseBadge}</td>
                <td class="text-end"><i class="fas fa-chevron-right text-secondary"></i></td>
            `;
            container.appendChild(tr);
        });
    }

    // 3. FILTRADOR (BUSCADOR)
    function filtrarUsuarios() {
        const texto = document.getElementById('search-input').value.toLowerCase();
        const filtrados = allUsers.filter(u => 
            (u.nombre || '').toLowerCase().includes(texto) || 
            (u.apellido || '').toLowerCase().includes(texto) ||
            (u.mail || '').toLowerCase().includes(texto)
        );
        renderUsers(filtrados);
    }

    // 4. ORDENAR TABLA (NUEVO)
    function ordenarLista(criterio) {
        if (criterio === 'apellido') {
            allUsers.sort((a, b) => {
                const apA = (a.apellido || '').toLowerCase();
                const apB = (b.apellido || '').toLowerCase();
                if (apA === apB) return (a.nombre || '').toLowerCase().localeCompare((b.nombre || '').toLowerCase());
                if (apA < apB) return -1;
                if (apA > apB) return 1;
                return 0;
            });
        } else if (criterio === 'clase') {
            allUsers.sort((a, b) => {
                const claseA = (a.nombre_clase || 'zzz').toLowerCase();
                const claseB = (b.nombre_clase || 'zzz').toLowerCase();
                if (claseA < claseB) return -1;
                if (claseA > claseB) return 1;
                const apA = (a.apellido || '').toLowerCase();
                const apB = (b.apellido || '').toLowerCase();
                if (apA < apB) return -1;
                if (apA > apB) return 1;
                return 0;
            });
        }
        renderUsers(allUsers);
    }

    // 5. VER DETALLE (MODAL)
    function verDetalle(id) {
        const u = allUsers.find(user => user.ID_Usuario == id);
        if(!u) return;

        // Llenar datos
        document.getElementById('modal-fullname').innerText = `${u.nombre} ${u.apellido}`;
        document.getElementById('modal-email').innerText = u.mail;
        document.getElementById('modal-dni').innerText = u.DNI || '-';
        document.getElementById('modal-tel').innerText = u.telefono || '-';
        document.getElementById('modal-peso').innerText = (u.peso || '0') + ' kg';
        document.getElementById('modal-altura').innerText = (u.altura || '0') + ' m';
        document.getElementById('modal-nac').innerText = u.fecha_nacimiento || '-';
        document.getElementById('modal-clase').innerText = u.nombre_clase || 'Sin Clase';

        // Manejar foto
        const img = document.getElementById('modal-img');
        const initial = document.getElementById('modal-initial');
        
        if (u.foto && u.foto !== 'default.jpg' && u.foto !== '') {
            img.src = `img/usuarios/${u.foto}`;
            img.classList.remove('d-none');
            initial.classList.add('d-none');
        } else {
            img.classList.add('d-none');
            initial.classList.remove('d-none');
            initial.innerText = u.nombre.charAt(0).toUpperCase();
        }

        new bootstrap.Modal(document.getElementById('userDetailModal')).show();
    }

    function logout() {
        localStorage.removeItem('gymtrack_user');
        window.location.href = 'login.html';
    }
  </script>
</body>
</html>
