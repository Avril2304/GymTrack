<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>GymTrack - Estadísticas</title>

  <link rel="icon" type="image/png" href="img/favicon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    :root {
        --bg-app: #121212;
        --bg-card: #1c1c1e;
        --bg-input: #2c2c2e;
        --primary: #0d6efd;
        --text-main: #FFFFFF;
        --text-sec: #A0A0A5;
        --danger: #dc3545;
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-main); padding-bottom: 40px; }

    .navbar-custom { background-color: var(--bg-card); border-bottom: 1px solid #333; padding: 12px 20px; }

    .hevy-card { background-color: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid #2a2a2a; }

    /* TARJETAS DE NÚMEROS (estilo "small-box" de AdminLTE, adaptado al tema oscuro) */
    .stat-card {
        background-color: var(--bg-card);
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 20px;
        height: 100%;
        position: relative;
        overflow: hidden;
    }
    .stat-card .stat-icon {
        position: absolute;
        right: 16px;
        top: 16px;
        font-size: 2rem;
        opacity: 0.15;
    }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: var(--text-main); line-height: 1.1; }
    .stat-card .stat-label { color: var(--text-sec); font-size: 0.85rem; margin-top: 4px; }
    .stat-card .stat-trend { font-size: 0.8rem; margin-top: 8px; }
    .stat-trend.up { color: #16a765; }
    .stat-trend.down { color: var(--danger); }
    .stat-trend.neutral { color: var(--text-sec); }
    .stat-trend.info { color: #4d9bff; }

    .chart-card { background-color: var(--bg-card); border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .chart-card h6 { color: var(--text-sec); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 280px; }

    .loading-placeholder { color: var(--text-sec); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>

  <script>
    const session = localStorage.getItem('gymtrack_user');
    if (!session) { window.location.href = 'login.html'; }
    else {
        const u = JSON.parse(session);
        if (u.es_admin !== 'S') { window.location.href = 'index.html'; }
    }
  </script>

  <div class="navbar-custom d-flex justify-content-between align-items-center sticky-top mb-4">
    <div class="d-flex align-items-center gap-2">
        <i class="fas fa-chart-line text-primary fs-4"></i>
        <span class="fw-bold fs-5">Estadísticas</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="admin.html" class="btn btn-sm btn-outline-light rounded-pill">
            <i class="fas fa-users me-1"></i> Usuarios
        </a>
        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="logout()">
            <i class="fas fa-sign-out-alt me-1"></i> Salir
        </button>
    </div>
  </div>

  <div class="container">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Dashboard</h2>
        <p class="text-secondary small mb-0">Monitoreo general del funcionamiento del sistema.</p>
    </div>

    <!-- NÚMEROS -->
    <div class="row g-3 mb-4" id="stats-row">
        <div class="col-12 loading-placeholder"><i class="fas fa-circle-notch fa-spin"></i> Cargando estadísticas...</div>
    </div>

    <!-- GRÁFICOS -->
    <div class="row">
        <div class="col-md-6">
            <div class="chart-card">
                <h6><i class="fas fa-bullseye me-1"></i> Socios por objetivo</h6>
                <div class="chart-wrap"><canvas id="chartObjetivos"></canvas></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h6><i class="fas fa-calendar-week me-1"></i> Entrenamientos por día de la semana</h6>
                <div class="chart-wrap"><canvas id="chartDias"></canvas></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h6><i class="fas fa-repeat me-1"></i> Frecuencia semanal de los socios (últimas 4 semanas)</h6>
                <div class="chart-wrap"><canvas id="chartFrecuencia"></canvas></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h6><i class="fas fa-ranking-star me-1"></i> Top 10 ejercicios más usados</h6>
                <div class="chart-wrap"><canvas id="chartTop"></canvas></div>
            </div>
        </div>
    </div>

  </div>

  <script>
    const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    // Grupos de frecuencia semanal (mismo orden y claves que devuelve api/dashboard.php)
    const FRECUENCIA = {
        sin: 'No entrenó',
        menos_1: 'Menos de 1 vez',
        '1_a_2': '1 a 2 veces',
        '3_a_4': '3 a 4 veces',
        '5_o_mas': '5 o más veces'
    };
    const COLORS = ['#0d6efd', '#16a765', '#fad165', '#dc3545', '#a479e2', '#43d692', '#4a86e8', '#f691b3', '#efa093', '#89d3b2'];

    Chart.defaults.color = '#A0A0A5';
    Chart.defaults.borderColor = '#2a2a2a';

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const data = await apiFetch('api/dashboard.php');

            if (!data.ok) {
                if (data._status === 403 && data.codigo === 'ADMIN_SIN_GIMNASIO') {
                    document.getElementById('stats-row').innerHTML = `
                        <div class="col-12 text-center py-4">
                            <p class="mb-3">Creá tu gimnasio primero.</p>
                            <a href="admin.html" class="btn btn-primary rounded-pill px-4">Ir a crear mi gimnasio</a>
                        </div>`;
                } else {
                    document.getElementById('stats-row').innerHTML =
                        `<div class="col-12 text-center text-danger">${esc(data.msg)}</div>`;
                }
                return;
            }

            renderStats(data.numeros);
            renderCharts(data.graficos);

        } catch (e) {
            console.error(e);
            document.getElementById('stats-row').innerHTML =
                `<div class="col-12 text-center text-danger">Error de conexión con el servidor.</div>`;
        }
    });

    // Compara con los 30 días anteriores y muestra la diferencia con signo ("+16" / "-16").
    // masEsMejor: true para altas (subir es bueno, verde); false para bajas (subir es malo, rojo).
    function tendencia(m, masEsMejor, sustantivo) {
        const dif = m.actual - m.anterior;
        const sube = dif > 0;
        return {
            trendIcon: dif === 0 ? 'fa-minus' : (sube ? 'fa-arrow-up' : 'fa-arrow-down'),
            trendClass: dif === 0 ? 'neutral' : ((sube === masEsMejor) ? 'up' : 'down'),
            trendText: dif === 0
                ? 'Igual que hace 30 días'
                : `${sube ? '+' : '-'}${Math.abs(dif)} ${sustantivo} que hace 30 días`
        };
    }

    function renderStats(n) {
        const cards = [
            {
                icon: 'fa-user-check',
                value: n.porcentaje_activos + '%',
                label: 'Socios activos (últ. 7 días)',
                trendClass: 'info',
                trendIcon: 'fa-users',
                trendText: `${n.socios_activos} de ${n.socios_total} inscriptos`
            },
            Object.assign({
                icon: 'fa-user-plus',
                value: n.socios_nuevos.actual,
                label: 'Socios nuevos (últ. 30 días)'
            }, tendencia(n.socios_nuevos, true, 'socios')),
            Object.assign({
                icon: 'fa-user-minus',
                value: n.bajas.actual,
                label: 'Bajas de socios (últ. 30 días)'
            }, tendencia(n.bajas, false, 'bajas')),
            {
                icon: 'fa-list-check',
                value: n.porcentaje_ejercicios_usados + '%',
                label: 'Del catálogo de ejercicios se usa'
            }
        ];

        const container = document.getElementById('stats-row');
        container.innerHTML = '';
        cards.forEach(c => {
            const col = document.createElement('div');
            col.className = 'col-6 col-lg-3';
            col.innerHTML = `
                <div class="stat-card">
                    <i class="fas ${c.icon} stat-icon"></i>
                    <div class="stat-value">${esc(c.value)}</div>
                    <div class="stat-label">${esc(c.label)}</div>
                    ${c.trendClass ? `<div class="stat-trend ${c.trendClass}"><i class="fas ${c.trendIcon} me-1"></i>${esc(c.trendText)}</div>` : ''}
                </div>
            `;
            container.appendChild(col);
        });
    }

    function renderCharts(g) {
        // 1. Socios por objetivo (torta)
        new Chart(document.getElementById('chartObjetivos'), {
            type: 'doughnut',
            data: {
                labels: g.objetivos.map(o => o.objetivo),
                datasets: [{ label: 'Socios', data: g.objetivos.map(o => o.cantidad), backgroundColor: COLORS, borderColor: '#1c1c1e', borderWidth: 2 }]
            },
            options: { plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } }, maintainAspectRatio: false }
        });

        // 2. Días de la semana (barras)
        const diasData = new Array(7).fill(0);
        g.dias_semana.forEach(d => { diasData[d.orden - 1] = d.asistencias; });
        new Chart(document.getElementById('chartDias'), {
            type: 'bar',
            data: {
                labels: DIAS,
                datasets: [{ label: 'Entrenamientos', data: diasData, backgroundColor: '#0d6efd', borderRadius: 6 }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, maintainAspectRatio: false }
        });

        // 3. Frecuencia semanal (barras): cuántos socios entrenan X veces por semana en promedio
        new Chart(document.getElementById('chartFrecuencia'), {
            type: 'bar',
            data: {
                labels: g.frecuencia_semanal.map(f => FRECUENCIA[f.rango] || f.rango),
                datasets: [{ label: 'Socios', data: g.frecuencia_semanal.map(f => f.cantidad), backgroundColor: '#a479e2', borderRadius: 6 }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    x: { title: { display: true, text: 'Veces por semana (promedio)' } },
                    y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'Socios' } }
                },
                maintainAspectRatio: false
            }
        });

        // 4. Top ejercicios (barras horizontales)
        new Chart(document.getElementById('chartTop'), {
            type: 'bar',
            data: {
                labels: g.top_ejercicios.map(e => e.nombre),
                datasets: [{ label: 'Usos', data: g.top_ejercicios.map(e => e.usos), backgroundColor: '#16a765', borderRadius: 6 }]
            },
            options: {
                indexAxis: 'y',
                plugins: { legend: { display: false } },
                scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
                maintainAspectRatio: false
            }
        });
    }

    // ===== GT-COMMON: utilidades compartidas (mismo bloque en todas las pantallas) =====
    // Escapa texto antes de meterlo en innerHTML (también sirve para valores de atributos).
    function esc(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    // La sesión del servidor venció (o nunca existió): limpiamos el login viejo y volvemos a login.html.
    function sesionExpirada() {
        localStorage.removeItem('gymtrack_user');
        try { sessionStorage.setItem('gymtrack_flash', 'Tu sesión expiró'); } catch (e) {}
        window.location.href = 'login.html';
    }

    // Reemplaza a fetch en toda la app. Devuelve siempre el JSON { ok, msg, data?, codigo? }
    // con el status HTTP agregado en _status (fetch no tira excepción en 4xx/5xx).
    // Ante un 401 redirige a login y deja la promesa colgada a propósito: la página se va,
    // así el catch de quien llamó no llega a mostrar un "Error de conexión" de más.
    // Solo tira excepción si falla la red.
    async function apiFetch(url, options = {}) {
        const init = Object.assign({}, options, { credentials: 'same-origin' });
        const res = await fetch(url, init);
        if (res.status === 401) {
            sesionExpirada();
            return new Promise(() => {});
        }
        let data;
        try { data = await res.json(); }
        catch (e) { data = { ok: false, msg: 'El servidor devolvió una respuesta inesperada.' }; }
        if (data === null || typeof data !== 'object') data = { ok: false, msg: 'El servidor devolvió una respuesta inesperada.' };
        data._status = res.status;
        return data;
    }

    function apiPost(url, body) {
        return apiFetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {})
        });
    }

    // Cierra sesión en el servidor (si se puede) y siempre limpia y redirige, falle lo que falle.
    async function logout() {
        try {
            await fetch('api/logout.php', {
                method: 'POST',
                credentials: 'same-origin',
                signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined
            });
        } catch (e) { /* si el servidor no responde, cerramos igual de este lado */ }
        localStorage.removeItem('gymtrack_user');
        window.location.href = 'login.html';
    }
    // ===== fin GT-COMMON =====
  </script>
</body>
</html>
